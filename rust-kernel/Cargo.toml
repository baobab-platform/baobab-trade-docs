[package]
name = "baobab-tdoc-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "baobab_tdoc_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "=0.30.1"

sha2 = "=0.10.9"

# PyO3's extension-module alters Unix linking: never activate it while
# running cargo test --all-features (the shared Foundation runtime gate).
# Maturin enables pyo3/extension-module directly for native wheel builds.
[features]
default = []
