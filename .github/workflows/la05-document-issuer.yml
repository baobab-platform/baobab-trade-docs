name: LA-05F document issuer PEP reference tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  issuance-reference:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.14
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v7.0.0+6
        with:
          python-version: "3.14"
      - name: Compile issuance PEP reference
        run: python -m py_compile reference/legal_actor_issuance.py tests/test_legal_actor_issuance.py
      - name: Verify fail-closed issuer assessment and non-issue
        run: python -m unittest discover -s tests -p test_legal_actor_issuance.py -v
