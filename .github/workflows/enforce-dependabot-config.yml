# BA-SEC-DEP-001: approved policy and merged strict Shared validator.
# Keep the repository's independent manifest-specific negative tests.
name: Enforce Dependency Maintenance Policy
on:
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/security-python.yml"
      - ".github/CODEOWNERS"
      - "docs/security/dependency-maintenance.md"
      - "tests/security/test_dependency_policy.py"
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/security-python.yml"
      - ".github/CODEOWNERS"
      - "docs/security/dependency-maintenance.md"
      - "tests/security/test_dependency_policy.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accepted-shared-baseline:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@584d7f3cd8426ffd3d1dc9f068f0b444dc74346e # reviewed strict Shared validator
    with:
      required-ecosystems: "github-actions,pip,cargo,docker,docker-compose"
      policy-level: strict

  manifest-policy-negatives:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned test parser in disposable environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/baobab-security-policy"
          "$RUNNER_TEMP/baobab-security-policy/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test real manifest and approval boundaries
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/baobab-security-policy/bin/python" -B -m unittest discover -s tests/security -p 'test_dependency_policy.py' -v
