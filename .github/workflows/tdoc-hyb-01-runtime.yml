name: TDOC-HYB-01 Hybrid Runtime (development only)
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'rust-kernel/**'
      - 'scripts/hyb01-bootstrap.sh'
      - '.devcontainer/**'
      - '.github/workflows/tdoc-hyb-01-runtime.yml'
      - 'docs/architecture/TDOC-HYB-01-implementation.md'
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'rust-kernel/**'
      - 'scripts/hyb01-bootstrap.sh'
      - '.devcontainer/**'
      - '.github/workflows/tdoc-hyb-01-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: tdoc
          POSTGRES_USER: tdoc
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tdoc -d tdoc"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: tdoc
      POSTGRES_USER: tdoc
      POSTGRES_PASSWORD: local-dev-only
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.90.0'
      - name: Enforce immutable dependencies and image references
        run: |
          test -s rust-kernel/Cargo.lock
          test -s runtime/requirements.lock
          grep -Eq '^FROM .*@sha256:[0-9a-f]{64}$' .devcontainer/Dockerfile
          grep -Eq 'image: postgres:17\.[0-9]+-bookworm@sha256:[0-9a-f]{64}' .devcontainer/compose.yml
          python -m pip install uv==0.13.5
          cp runtime/requirements.lock /tmp/requirements.lock
          uv pip compile --python-version 3.14 --generate-hashes --output-file runtime/requirements.lock runtime/requirements.in
          diff -u /tmp/requirements.lock runtime/requirements.lock
          (cd rust-kernel && cargo metadata --locked --format-version 1 --no-deps > /dev/null)
      - name: Install hash-locked Python environment
        run: |
          python -m venv .venv
          uv pip sync --python .venv/bin/python --require-hashes runtime/requirements.lock
          .venv/bin/python -m pip check
      - name: Build and test locked Rust wheel
        working-directory: rust-kernel
        run: |
          cargo test --locked
          ../.venv/bin/maturin build --locked --release --interpreter ../.venv/bin/python --out ../dist-wheels
          uv pip install --python ../.venv/bin/python --no-index --no-deps --find-links ../dist-wheels baobab-tdoc-kernel==0.1.0
      - name: Django and PostgreSQL 17 evidence
        working-directory: runtime
        run: |
          ../.venv/bin/python manage.py check
          ../.venv/bin/python manage.py migrate --noinput
          ../.venv/bin/python manage.py test tests -v2
          ../.venv/bin/python -c "from tdoc_runtime.kernel import kernel_probe; assert kernel_probe() == 'rust-pyo3-ok'"
      - name: Assert no issuer activation
        run: |
          grep -F 'provider_active": False' runtime/tdoc_runtime/urls.py
          grep -F 'ARCHITECTURE_ONLY' .baobab/rtd-conformance.yaml

  cold-devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Build clean pinned DevContainer without cache
        run: docker compose -f .devcontainer/compose.yml build --no-cache --pull workspace
      - name: Execute native bootstrap in clean container
        run: |
          docker compose -f .devcontainer/compose.yml up -d --wait
          docker compose -f .devcontainer/compose.yml exec -T -w /workspaces/baobab-trade-docs workspace bash scripts/hyb01-bootstrap.sh
      - name: Cleanup disposable topology
        if: always()
        run: docker compose -f .devcontainer/compose.yml down -v --remove-orphans

  security-evidence:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Scan Python lock and export CycloneDX inventory
        run: |
          mkdir -p evidence
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r runtime/requirements.lock --format cyclonedx-json --output evidence/python-lock.cdx.json
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust-kernel
      - uses: anchore/sbom-action@a61e3c81cfa072d15e731a6c98ab810e75f2e1a6
        with:
          path: .
          format: cyclonedx-json
          output-file: evidence/repository.cdx.json
          artifact-name: tdoc-hyb01-repository-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tdoc-hyb01-python-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
