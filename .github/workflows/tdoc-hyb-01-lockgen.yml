name: TDOC-HYB-01 Lock Generation (temporary)
on:
  pull_request:
    paths:
      - runtime/requirements.in
      - .github/workflows/tdoc-hyb-01-lockgen.yml
permissions:
  contents: read
jobs:
  lockgen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.90.0'
      - name: Generate locked hashes
        run: |
          python -m pip install uv==0.13.5
          uv pip compile --python-version 3.14 --generate-hashes --output-file runtime/requirements.lock runtime/requirements.in
          (cd rust-kernel && cargo generate-lockfile)
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in ("runtime/requirements.lock", "rust-kernel/Cargo.lock"):
              raw = Path(name).read_bytes()
              data = base64.b64encode(raw).decode("ascii")
              print(f"LOCKBEGIN {name} {len(raw)}")
              for i in range(0, len(data), 2000):
                  print("LOCKCHUNK " + data[i:i+2000])
              print(f"LOCKEND {name}")
          PY
